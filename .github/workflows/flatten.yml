name: flatten-manifests

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: flatten-manifests
  cancel-in-progress: true

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - name: checkout cozy-winget
        uses: actions/checkout@v4
        with:
          path: cozy-winget

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install dependencies
        run: pip install -r cozy-winget/requirements.txt

      - name: clone winget-pkgs
        run: |
          git clone --depth 1 https://github.com/microsoft/winget-pkgs.git winget-pkgs

      - name: flatten manifests
        run: |
          python cozy-winget/scripts/flatten_manifests.py \
            winget-pkgs/manifests \
            -o cozy-winget/manifest.jsonl

      - name: commit and push if changed
        working-directory: cozy-winget
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.jsonl
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: refresh manifest.jsonl ($(date -u +%Y-%m-%d))"
          git push
